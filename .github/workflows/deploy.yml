name: Build and Deploy Dynamic App

on:
  push:
    branches:
      - master
    paths:
      - 'web-dinamis/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./web-dinamis
          file: ./web-dinamis/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis-uas:latest

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            # Pindah ke home direktori AWS
            cd /home/${{ secrets.AWS_USERNAME }}

            # Trik jitu: Hapus file lama dan tulis ulang docker-compose.yml langsung di server
            rm -f docker-compose.yml

            cat << 'EOF' > docker-compose.yml
            version: '3.8'

            services:
              web-statis:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/web-statis-uas:latest
                container_name: web-statis-app
                ports:
                  - "80:80"
                networks:
                  - uas-network

              web-dinamis:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis-uas:latest
                container_name: web-dinamis-app
                ports:
                  - "8080:80"
                volumes:
                  - ./web-dinamis:/var/www/html
                depends_on:
                  - db-server
                networks:
                  - uas-network

              db-server:
                image: mariadb:10.6
                container_name: mariadb-app
                environment:
                  MYSQL_ROOT_PASSWORD: uas_root_password
                  MYSQL_DATABASE: uas_db
                  MYSQL_USER: uas_user
                  MYSQL_PASSWORD: uas_password
                volumes:
                  - db_data:/var/lib/mysql
                networks:
                  - uas-network

            networks:
              uas-network:
                driver: bridge

            volumes:
              db_data:
            EOF

            # Login ke Docker Hub di dalam EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull image web-dinamis yang barusan di-build oleh GitHub Actions
            docker compose pull web-dinamis

            # Restart container yang mengalami perubahan kode saja (Zero Downtime)
            docker compose up -d --remove-orphans