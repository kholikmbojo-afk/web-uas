name: Build and Deploy Dynamic App

on:
  push:
    branches:
      - master
    paths:
      - 'web-dinamis/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./web-dinamis
          file: ./web-dinamis/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis-uas:latest

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix permissions before SCP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            sudo rm -rf /home/${{ secrets.AWS_USERNAME }}/web-dinamis/db
            mkdir -p /home/${{ secrets.AWS_USERNAME }}/web-dinamis/db

      - name: Copy db folder to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "web-dinamis/db/"
          target: "/home/${{ secrets.AWS_USERNAME }}/"
          overwrite: true

      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.AWS_USERNAME }}

            rm -f docker-compose.yml

            cat << 'EOF' > docker-compose.yml
            version: '3.8'

            services:
              web-statis:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/web-statis-uas:latest
                container_name: web-statis-app
                ports:
                  - "80:80"
                restart: always
                networks:
                  - uas-network

              web-dinamis:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis-uas:latest
                container_name: web-dinamis-app
                ports:
                  - "3000:80"
                environment:
                  - DATABASE_HOST=db-server
                  - DATABASE_USER=uas_user
                  - DATABASE_PASSWORD=uas_password
                  - DATABASE_NAME=uas_db
                depends_on:
                  - db-server
                restart: always
                networks:
                  - uas-network

              db-server:
                image: mariadb:10.6
                container_name: mariadb-app
                environment:
                  MYSQL_ROOT_PASSWORD: uas_root_password
                  MYSQL_DATABASE: uas_db
                  MYSQL_USER: uas_user
                  MYSQL_PASSWORD: uas_password
                volumes:
                  - ./web-dinamis/db:/docker-entrypoint-initdb.d
                  - db_data:/var/lib/mysql
                restart: always
                networks:
                  - uas-network

            networks:
              uas-network:
                driver: bridge

            volumes:
              db_data:
            EOF

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker compose pull web-dinamis

            docker compose down -v

            docker compose up -d --remove-orphans