version: '3.8'

services:
  # 1. Aplikasi Web Statis (Akses langsung via Port 80)
  web-statis:
    image: ${DOCKERHUB_USERNAME}/web-statis-uas:latest
    container_name: web-statis-app
    ports:
      - "80:80"
    restart: always
    networks:
      - uas-network

  # 2. Aplikasi Web Dinamis (Akses via Port 3000 sesuai Security Group AWS lu)
  web-dinamis:
    image: ${DOCKERHUB_USERNAME}/web-dinamis-uas:latest
    container_name: web-dinamis-app
    ports:
      - "3000:80"
    environment:
      - DATABASE_HOST=db-server
      - DATABASE_USER=uas_user
      - DATABASE_PASSWORD=uas_password
      - DATABASE_NAME=uas_db
    restart: always
    depends_on:
      - db-server
    networks:
      - uas-network

  # 3. Database MariaDB (Tertutup dari Publik, Ter-seeding otomatis)
  db-server:
    image: mariadb:10.6
    container_name: mariadb-app
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: uas_db
      MYSQL_USER: uas_user
      MYSQL_PASSWORD: uas_password
    volumes:
      # Pastikan lu punya file dump database (misal: init.sql) di folder lokal/db untuk otomatisasi seeding
      - ./db:/docker-entrypoint-initdb.d/
      - db-data:/var/lib/mysql
    networks:
      - uas-network

networks:
  uas-network:
    driver: bridge

volumes:
  db-data: